    return(<div className="w-full h-screen flex flex-col overflow-hidden">
      <div className="bg-gradient-to-r from-purple-700 to-blue-600 text-white px-4 py-2 flex justify-between items-center flex-shrink-0"><div className="flex items-center gap-2"><span className="font-bold text-sm">{scenario.title}</span><span className="text-xs px-2 py-0.5 bg-white bg-opacity-20 rounded">{code}</span><span className="text-xs px-2 py-0.5 bg-white bg-opacity-20 rounded">{scenario.diff}</span></div><div className="flex items-center gap-2">{!frtDone&&<div className={`px-2 py-0.5 rounded font-bold text-xs ${frt<=10?'bg-red-500 animate-pulse':frt<=30?'bg-orange-500':'bg-green-600'}`}>FRT {frt}s</div>}{nrtActive&&<div className={`px-2 py-0.5 rounded font-bold text-xs ${nrtC}`}>NRT {fmt(nrt)}</div>}<div className="px-2 py-0.5 bg-white bg-opacity-20 rounded font-mono text-xs">{fmt(time)}</div><button onClick={reset} className="px-3 py-1 bg-white text-purple-700 rounded font-semibold text-xs">End</button></div></div>
      <div className="flex-1 flex overflow-hidden">
        <div className="w-64 bg-gray-50 border-r flex flex-col overflow-y-auto flex-shrink-0 p-3 gap-2 text-xs">
          <div className="bg-white p-3 rounded-xl shadow-sm"><p className="font-bold text-gray-400 mb-1">ORDER</p><p className="font-semibold">{scenario.cust.device}</p><p className="text-gray-500">{scenario.cust.grade} · {scenario.cust.price}</p><p className="text-gray-400">{scenario.cust.order}</p></div>
          <div className="bg-purple-50 p-3 rounded-xl border border-purple-200"><p className="font-bold text-purple-700 mb-1">MOOD</p><p className="font-semibold text-purple-800">{scenario.mood}</p></div>
          <div className="bg-blue-50 p-3 rounded-xl"><p className="font-bold text-blue-700 mb-2">MACROS ({macrosUsed.length} used)</p>{MACROS.filter(m=>mt==='NOTE'?true:!m.noteOnly).map(m=>(<button key={m.id} onClick={()=>setInput(m.text)} className={`w-full mb-1 px-2 py-1.5 rounded-lg text-left text-xs ${macrosUsed.includes(m.id)?'bg-blue-600 text-white':'bg-white hover:bg-blue-50 border'}`}><strong>{m.id}</strong> {m.title}{macrosUsed.includes(m.id)?' ✓':''}</button>))}</div>
          {scenario.diff!=='Advanced'&&<div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200"><p className="font-bold text-emerald-700 mb-1">SUGGESTED PATH</p>{scenario.path.map((p,i)=><p key={i} className="mb-0.5">✓ {p}</p>)}</div>}
          <div className="bg-amber-50 p-3 rounded-xl border border-amber-200"><p className="font-bold text-amber-700 mb-1">CHALLENGES</p>{scenario.chal.map((c,i)=><p key={i} className="mb-0.5">⚠ {c}</p>)}</div>
        </div>
        <div className="flex-1 flex flex-col overflow-hidden">
          <div className="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-50">
            {msgs.length===0&&<p className="text-center text-gray-400 mt-8 text-sm">⏳ Waiting for customer's first message…</p>}
            {msgs.map((m,i)=>(<div key={i} className={`flex ${m.sender==='agent'?'justify-end':m.sender==='system'?'justify-center':'justify-start'}`}><div className={`max-w-sm px-3 py-2 rounded-2xl text-sm shadow-sm ${m.sender==='agent'?m.messageType==='NOTE'?'bg-yellow-100 border-2 border-yellow-400 text-gray-800':'bg-blue-600 text-white':m.sender==='system'?'automsg text-gray-700 text-xs':'bg-white border'}`}>{m.messageType==='NOTE'&&<p className="text-xs font-bold text-yellow-700 mb-1">📝 INTERNAL NOTE</p>}<p>{m.text}</p>{m.fileUrl&&<div className="mt-1">{m.fileType?.startsWith('image/')?<img src={m.fileUrl} alt={m.fileName} className="fp"/>:<a href={m.fileUrl} target="_blank" rel="noopener noreferrer" className="underline text-xs">📎 {m.fileName}</a>}</div>}</div></div>))}
            <div ref={chatEnd}/>
          </div>
          <div className="border-t bg-white p-3 flex-shrink-0">
            <div className="flex gap-2 mb-1"><button onClick={()=>setMt('REPLY')} className={`px-3 py-1 rounded text-xs font-bold ${mt==='REPLY'?'bg-blue-600 text-white':'bg-gray-200'}`}>REPLY</button><button onClick={()=>setMt('NOTE')} className={`px-3 py-1 rounded text-xs font-bold ${mt==='NOTE'?'bg-yellow-500 text-white':'bg-gray-200'}`}>NOTE</button></div>
            <div className="flex gap-2 mb-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isClosed&&handleSend()} disabled={isClosed} placeholder={isClosed?'Chat closed':mt==='NOTE'?'Internal note…':'Message…'} className="flex-1 px-3 py-2 border-2 rounded-xl text-sm disabled:bg-gray-100"/><button onClick={handleSend} disabled={isClosed} className={`px-4 py-2 rounded-xl text-sm font-semibold ${mt==='NOTE'?'bg-yellow-500 text-white':'bg-blue-600 text-white'} disabled:opacity-40`}>{mt==='NOTE'?'Note':'Send'}</button></div>
            <div className="flex gap-2 mb-2 text-xs"><input type="file" ref={fileRef} onChange={handleFile} accept="image/*,.pdf,.doc,.docx,.txt" style={{display:'none'}}/><button onClick={()=>fileRef.current?.click()} disabled={uploading||isClosed} className="text-gray-500 hover:text-gray-700 disabled:opacity-40">{uploading?'⏳ Uploading…':'📎 Attach'}</button></div>
            <div className="border-t pt-2"><p className="text-xs font-bold text-gray-500 mb-1">🎫 TICKET {ticketDone&&<span className="text-green-600 ml-1">✓ Submitted</span>}</p><div className="flex gap-2"><select value={ticketStatus} onChange={e=>setTicketStatus(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Status…</option><option value="open">Open</option><option value="pending">Pending</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><select value={ticketPriority} onChange={e=>setTicketPriority(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Priority…</option><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select><select value={ticketCategory} onChange={e=>setTicketCategory(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Category…</option><option value="delivery">Delivery</option><option value="condition">Condition</option><option value="return">Return/Refund</option><option value="technical">Technical</option><option value="warranty">Warranty</option><option value="account">Account</option></select><button onClick={()=>setTicketDone(true)} disabled={ticketDone||(!ticketStatus&&!ticketPriority)} className="px-3 py-1 bg-purple-600 text-white rounded text-xs font-bold hover:bg-purple-700 disabled:opacity-40">{ticketDone?'✓':'Submit'}</button></div></div>
          </div>
        </div>
      </div>
      {canFinish&&!showQA&&<div className="bg-green-50 border-t-2 border-green-400 p-2 text-center flex-shrink-0"><button onClick={()=>setShowQA(true)} className="px-6 py-2 bg-green-600 text-white rounded-xl font-bold text-sm hover:bg-green-700">✓ Finish &amp; View QA Score</button></div>}
      {showQA&&(()=>{const q=calcQA();return(<div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl p-6 max-w-2xl w-full overflow-y-auto max-h-screen"><h2 className="text-xl font-bold text-center mb-4">📊 QA Evaluation</h2><div className="grid grid-cols-5 gap-2 mb-4">{[['FRT',q.frtSc,25,'green'],['NRT',q.nrtSc,20,'orange'],['Macros',q.macSc,29,'blue'],['Empathy',q.empSc,25,'purple'],['Ticket',q.tickSc,10,'indigo']].map(([l,s,m,c])=>(<div key={l} className={`p-3 rounded-xl text-center bg-${c}-50 border border-${c}-200`}><p className="text-xs font-bold text-gray-500">{l}</p><p className={`text-2xl font-bold text-${c}-600`}>{s}/{m}</p></div>))}</div><div className="bg-gradient-to-r from-purple-100 to-blue-100 p-5 rounded-xl text-center mb-4"><p className="text-5xl font-bold text-purple-700">{q.total}/109</p><p className="mt-1 text-sm">{q.total>=90?'🌟 Outstanding!':q.total>=70?'✅ Good job!':q.total>=50?'📈 Keep improving':'💪 Practice more'}</p></div><div className="bg-amber-50 p-4 rounded-xl mb-4 text-sm"><p className="font-bold mb-1">Ticket: Status (+5) · Priority (+3) · Category (+2)</p>{ticketDone?<p>Submitted: <strong>{ticketStatus}</strong> / <strong>{ticketPriority}</strong> / <strong>{ticketCategory||'–'}</strong></p>:<p className="text-red-600">⚠ No ticket submitted.</p>}</div><div className="flex gap-3"><button onClick={()=>setShowQA(false)} className="flex-1 py-2 bg-gray-200 rounded-xl text-sm">Close</button><button onClick={reset} className="flex-1 py-2 bg-purple-600 text-white rounded-xl font-bold text-sm">New Session</button></div></div></div>);})()}
    </div>);
  }
  return(<div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="w-full max-w-sm"><button onClick={reset} className="mb-3 px-4 py-2 bg-white rounded-xl shadow text-sm">← Exit</button><div className="bg-white rounded-2xl shadow-xl overflow-hidden"><div className="bg-green-500 text-white p-3"><h2 className="font-bold">Back Market Support</h2><p className="text-xs opacity-70">Session: {code}</p></div>{scenario.hints&&(<div className="bg-yellow-50 border-b-2 border-yellow-200 p-3"><p className="text-xs font-bold text-yellow-800 mb-1">🎭 {scenario.mood}</p><ul className="text-xs text-yellow-700 space-y-0.5">{scenario.hints.map((h,i)=><li key={i}>• {h}</li>)}</ul></div>)}<div className="h-96 overflow-y-auto p-3 space-y-2 bg-gray-50">{isClosed&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 text-center text-red-700 font-bold text-sm">🔴 Agent closed the conversation</div>}{msgs.length===0&&(<div className="bg-amber-50 rounded-xl p-3 border"><p className="font-semibold text-sm">🎭 {scenario.cust.name}</p><p className="text-xs text-gray-500 mb-1">{scenario.cust.device} · {scenario.cust.order}</p><p className="text-xs text-orange-700 font-semibold">Send your opening message:</p><p className="text-xs text-gray-500 italic mt-1">💡 Suggested: "{scenario.msg}"</p></div>)}{msgs.map((m,i)=>m.messageType!=='NOTE'&&(<div key={i} className={`flex ${m.sender==='customer'?'justify-end':m.sender==='system'?'justify-center':'justify-start'}`}><div className={`px-3 py-2 rounded-xl max-w-xs text-sm ${m.sender==='customer'?'bg-green-500 text-white':m.sender==='system'?'automsg text-gray-600 text-xs':'bg-white border shadow-sm'}`}><p>{m.text}</p>{m.fileUrl&&<div className="mt-1">{m.fileType?.startsWith('image/')?<img src={m.fileUrl} alt={m.fileName} className="fp"/>:<a href={m.fileUrl} target="_blank" rel="noopener noreferrer" className="underline text-xs">📎 {m.fileName}</a>}</div>}</div></div>))}<div ref={chatEnd}/></div><div className="border-t p-3"><div className="flex gap-2"><input type="file" ref={fileRef} onChange={handleFile} accept="image/*,.pdf,.doc,.docx,.txt" style={{display:'none'}}/><button onClick={()=>fileRef.current?.click()} disabled={uploading||isClosed} className="text-lg disabled:opacity-40">{uploading?'⏳':'📎'}</button><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isClosed&&handleSend()} disabled={isClosed} placeholder={isClosed?'Closed':'Type your message…'} className="flex-1 px-3 py-2 border-2 rounded-full text-sm disabled:bg-gray-100"/><button onClick={handleSend} disabled={isClosed} className="px-4 py-2 bg-green-500 text-white rounded-full text-sm font-semibold disabled:opacity-40">Send</button></div></div></div></div></div>);
}
ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script></body></html>
